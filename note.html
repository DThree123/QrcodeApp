<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Information</title>

  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial;
      background: #f3f6f6;
      color: #202728;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      background: #fff;
      border: 1px solid #dce5e5;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px #14282814;
    }

    .kicker {
      color: #0e888b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 24px;
      font-size: 30px;
    }

    .row {
      padding: 16px 0;
      border-top: 1px solid #e7eded;
    }

    .label {
      display: block;
      color: #687475;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 19px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 22px;
      color: #687475;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="kicker">
      Device information
    </div>

    <h1 id="title">
      Device
    </h1>

    <div class="row">
      <span class="label">
        Name
      </span>

      <div class="value" id="name">
        —
      </div>
    </div>

    <div class="row">
      <span class="label">
        Serial No.
      </span>

      <div class="value" id="serial">
        —
      </div>
    </div>

    <div class="row">
      <span class="label">
        Date Delivery
      </span>

      <div class="value" id="date">
        —
      </div>
    </div>

    <div class="footer">
      TimeTech • Device record
    </div>

  </main>

  <script>
    let p = new URLSearchParams(location.search);

    let n = p.get('n') || '';
    let s = p.get('s') || '';
    let d = p.get('d') || '';

    function fd(v) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
        return v || '—';
      }

      return new Date(v + 'T00:00:00').toLocaleDateString(
        'en-GB',
        {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }
      );
    }

    document.getElementById('title').textContent = n || 'Device';

    document.getElementById('name').textContent = n || '—';

    document.getElementById('serial').textContent =
      s || 'Serial number not found';

    document.getElementById('date').textContent = fd(d);
  </script>

</body>
</html>
